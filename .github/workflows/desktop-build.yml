name: Desktop Build

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  build-macos:
    name: Build macOS installers
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [frame, news, campaign, content, creative]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop deps
        run: npm --prefix desktop ci

      - name: Build macOS flavor
        run: npm --prefix desktop run dist:${{ matrix.flavor }} -- --mac
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Verify macOS artifacts
        run: npm --prefix desktop run verify:artifacts -- ${{ matrix.flavor }} mac

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.flavor }}
          path: desktop/dist/${{ matrix.flavor }}/*.dmg

  build-windows:
    name: Build Windows installers
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [frame, news, campaign, content, creative]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop deps
        run: npm --prefix desktop ci

      - name: Build Windows flavor
        run: npm --prefix desktop run dist:${{ matrix.flavor }} -- --win
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Verify Windows artifacts
        run: npm --prefix desktop run verify:artifacts -- ${{ matrix.flavor }} win

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.flavor }}
          path: |
            desktop/dist/${{ matrix.flavor }}/*.exe
            desktop/dist/${{ matrix.flavor }}/*.msi

  publish-release:
    name: Publish GitHub Release Assets
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    needs: [build-macos, build-windows]

    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/macos-*/*.dmg
            release-artifacts/windows-*/*.exe
            release-artifacts/windows-*/*.msi
          generate_release_notes: true
