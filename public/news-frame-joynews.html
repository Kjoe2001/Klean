function decode(b64){const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder('utf-8').decode(bytes);}
function fit(f){try{f.style.height=(f.contentDocument.body.scrollHeight+10)+'px';}catch(e){}}
function mount(n){
  const f=document.getElementById('if'+n);
  if(f.dataset.m) { fit(f); return; }
  f.dataset.m='1';
  f.addEventListener('load',()=>{
    fit(f);
    try{ new ResizeObserver(()=>fit(f)).observe(f.contentDocument.body); }catch(e){}
  });
  f.srcdoc = decode(SRC[n]);
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  const n=t.dataset.f;
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  document.getElementById('pane1').classList.toggle('on',n==='1');
  document.getElementById('pane2').classList.toggle('on',n==='2');
  mount(n);
  setTimeout(()=>fit(document.getElementById('if'+n)),80);
}));
mount('1');
</script>
