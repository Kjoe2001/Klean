<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zelvoo Creative Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;800;900&family=Hanken+Grotesk:wght@300;400;500;600;700;800&family=Inter:wght@300;400;600;800;900&family=Poppins:wght@300;400;600;800;900&family=Montserrat:wght@300;400;700;900&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,700&family=DM+Serif+Display&family=Space+Grotesk:wght@300;400;700&family=Bebas+Neue&family=Anton&family=Oswald:wght@300;400;700&family=Lora:wght@400;700&family=Caveat:wght@400;700&family=Archivo+Black&family=Syne:wght@400;700;800&family=Sora:wght@300;400;700;800&family=Outfit:wght@300;400;700;900&family=Fraunces:ital,wght@0,400;0,700;0,900;1,900&family=Instrument+Serif:ital@0;1&family=Bricolage+Grotesque:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--ink:#0A0F0D;--soft:#5A655F;--faint:#8D9793;--line:#E4E8E7;--stage:#E7EAEA;--green:#00DF81;--gink:#046B45;--wash:#F4F7F6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Hanken Grotesk',system-ui,sans-serif;color:var(--ink);background:var(--wash);overflow:hidden;font-size:13px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#ccd4d1;border-radius:6px}
.app{display:flex;height:100%}
.rail{width:78px;background:#fff;border-right:1px solid var(--line);flex:none;display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:4px;overflow-y:auto;z-index:50}
.rmark{width:34px;height:34px;border-radius:10px;background:var(--ink);color:var(--green);font-family:'Unbounded';font-weight:800;font-size:17px;display:grid;place-items:center;margin-bottom:14px}
.rnew{width:52px;height:52px;border-radius:17px;background:var(--green);color:#012a1b;font-size:26px;font-weight:300;display:grid;place-items:center;box-shadow:0 8px 20px -8px rgba(0,223,129,.9);line-height:1}
.rnew:hover{transform:translateY(-1px)}
.rlbl{font-size:10px;font-weight:700;color:var(--soft);margin:5px 0 14px}
.rb{width:60px;padding:9px 0;border-radius:13px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9.5px;font-weight:700;color:var(--soft)}
.rb .ic{font-size:16px;line-height:1}
.rb:hover{background:#F2F5F4}.rb.on{background:#E7FBF2;color:var(--gink)}
.home{flex:1;overflow-y:auto;background:radial-gradient(900px 380px at 12% -8%,#D8FBEC 0,transparent 60%),radial-gradient(700px 320px at 88% -4%,#E6EEFF 0,transparent 62%),var(--wash)}
.hwrap{max-width:1180px;margin:0 auto;padding:48px 34px 90px}
.hero{text-align:center;margin-bottom:26px}
.hero .kick{font-size:11px;font-weight:800;letter-spacing:.22em;color:var(--gink);text-transform:uppercase}
.hero h1{font-family:'Unbounded';font-weight:800;font-size:clamp(27px,4vw,44px);letter-spacing:-.025em;margin-top:12px;line-height:1.06}
.hero h1 em{font-style:normal;color:var(--gink);position:relative}
.hero h1 em:after{content:"";position:absolute;left:0;right:0;bottom:.06em;height:.16em;background:var(--green);border-radius:3px;z-index:-1}
.hero p{color:var(--soft);font-size:15px;margin-top:12px}
.startrow{display:flex;gap:12px;justify-content:center;margin-top:24px;flex-wrap:wrap}
.bigbtn{display:flex;align-items:center;gap:11px;background:var(--ink);color:#fff;border-radius:15px;padding:15px 24px;font-weight:700;font-size:14.5px;box-shadow:0 14px 30px -16px rgba(10,15,13,.8)}
.bigbtn .p{width:26px;height:26px;border-radius:9px;background:var(--green);color:#012a1b;display:grid;place-items:center;font-size:19px;font-weight:300;line-height:1}
.bigbtn:hover{transform:translateY(-1px)}
.bigbtn.alt{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.bigbtn.alt .p{background:#E7FBF2;color:var(--gink)}
.brandstrip{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 16px;margin-top:26px}
.bslogo{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-family:'Unbounded';font-weight:800;font-size:16px;flex:none;overflow:hidden}
.bslogo img{width:100%;height:100%;object-fit:contain}
.bsdots{display:flex;gap:4px}
.bsdots i{width:15px;height:15px;border-radius:5px;border:1px solid rgba(0,0,0,.08)}
.fmts{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;margin-top:22px}
.fmt{background:#fff;border:1px solid var(--line);border-radius:15px;padding:15px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:9px;transition:.14s}
.fmt:hover{border-color:var(--green);transform:translateY(-2px)}
.fmt .shape{background:linear-gradient(150deg,#0A0F0D,#16241E);border-radius:5px;position:relative;overflow:hidden}
.fmt .shape:after{content:"";position:absolute;left:16%;right:16%;top:34%;height:12%;background:var(--green);border-radius:2px}
.fmt .n{font-size:11.5px;font-weight:700;text-align:center;line-height:1.25}
.fmt .d{font-size:10px;color:var(--faint)}
.sechead{display:flex;align-items:baseline;gap:12px;margin:40px 0 14px}
.sechead h2{font-family:'Unbounded';font-weight:600;font-size:17px;letter-spacing:-.01em}
.sechead .c{font-size:12px;color:var(--faint)}
.cats{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.cat{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:700;color:var(--soft)}
.cat.on{background:var(--ink);border-color:var(--ink);color:#fff}
.gal,.recents{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:16px}
.gcard{cursor:pointer}
.gcard .pv{border-radius:13px;overflow:hidden;border:1px solid var(--line);background:#fff;position:relative;transition:.14s}
.gcard:hover .pv{transform:translateY(-3px);box-shadow:0 18px 34px -20px rgba(10,15,13,.55);border-color:var(--green)}
.gcard .use{position:absolute;inset:auto 0 0 0;background:linear-gradient(transparent,rgba(10,15,13,.86));color:#fff;font-size:11.5px;font-weight:800;padding:22px 10px 9px;opacity:0;transition:.14s}
.gcard:hover .use{opacity:1}
.gcard .delD{position:absolute;top:7px;right:7px;width:24px;height:24px;border-radius:8px;background:rgba(10,15,13,.72);color:#fff;font-size:12px;display:none;align-items:center;justify-content:center;z-index:2}
.gcard .delD:hover{background:#E4364B}
.gcard:hover .delD{display:flex}
.gcard .meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;gap:6px}
.gcard .nm{font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gcard .rt{font-size:10px;color:var(--faint);font-weight:600;flex:none}
.blank{border:1.5px dashed #C8D2CE;border-radius:13px;background:#fff;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:var(--soft);font-weight:700;font-size:12.5px}
.blank .pl{width:34px;height:34px;border-radius:12px;background:#E7FBF2;color:var(--gink);display:grid;place-items:center;font-size:21px;font-weight:300;line-height:1}
.blank:hover{border-color:var(--green);color:var(--gink)}
.emptyR{grid-column:1/-1;color:var(--faint);font-size:13px;padding:20px 0;line-height:1.6}
.mask{position:fixed;inset:0;background:rgba(10,15,13,.5);display:none;place-items:center;z-index:200;padding:20px}
.mask.on{display:grid}
.modal{background:#fff;border-radius:22px;padding:26px;width:min(560px,100%);max-height:88vh;overflow-y:auto}
.modal h3{font-family:'Unbounded';font-weight:700;font-size:19px;margin-bottom:5px}
.modal p.s{color:var(--soft);font-size:13px;margin-bottom:18px}
.msizes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.ms{border:1px solid var(--line);border-radius:12px;padding:11px 13px;text-align:left;display:flex;align-items:center;gap:11px}
.ms:hover{border-color:var(--green);background:#F6FFFB}
.ms .sq{background:#DDE4E1;border-radius:3px;flex:none}
.ms .t{font-size:12.5px;font-weight:700}.ms .u{font-size:10.5px;color:var(--faint)}
.crow{display:flex;gap:8px;align-items:flex-end}
.crow label{font-size:10.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:5px}
.editor{flex:1;display:none;flex-direction:column;min-width:0;background:var(--stage)}
.editor.on{display:flex}.home.off{display:none}
.top{height:52px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px;padding:0 12px;flex:none;z-index:40}
.sep{width:1px;height:24px;background:var(--line)}
select,input[type=text],input[type=number]{font-family:inherit;font-size:12.5px;border:1px solid var(--line);border-radius:7px;padding:6px 7px;color:var(--ink);background:#fff}
input[type=number]{width:62px}.mini{width:56px}
.btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:6px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--green)}.btn:disabled{opacity:.4;cursor:default}
.btn.green{background:var(--green);border-color:var(--green);color:#012a1b}
.btn.icon{padding:6px 9px;font-size:14px;line-height:1}
.spacer{flex:1}
.kitchip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px;font-weight:700}
.kitchip:hover{border-color:var(--green)}
.kitchip i{width:12px;height:12px;border-radius:4px;display:inline-block}
.zoomctl{display:flex;align-items:center;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.zoomctl button{padding:6px 9px;font-size:14px;font-weight:700;color:var(--soft);background:#fff}
.zoomctl span{font-size:11.5px;min-width:42px;text-align:center;color:var(--soft)}
.ebody{flex:1;display:flex;min-height:0}
.erail{width:64px;background:#fff;border-right:1px solid var(--line);flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;overflow-y:auto}
.eb{width:52px;height:50px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:9.5px;font-weight:700;color:var(--soft)}
.eb:hover{background:#F2F5F4}.eb.on{background:#E7FBF2;color:var(--gink)}
.eb .ic{font-size:16px;line-height:1}
.side{width:264px;background:#fff;border-right:1px solid var(--line);flex:none;overflow-y:auto;padding:14px 13px 44px}
h3{font-family:'Unbounded';font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--soft);margin:2px 0 10px}
.grp{margin-bottom:15px;padding-bottom:13px;border-bottom:1px solid var(--line)}
.grp:last-child{border-bottom:none;margin-bottom:0}
.lbl{font-size:10.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;display:block}
.rowf{display:flex;gap:6px;align-items:center;margin-bottom:7px}
.rowf>select,.rowf>input[type=text]{flex:1;min-width:0}
.twocol{display:flex;gap:6px}.twocol>div{flex:1;min-width:0}.twocol input{width:100%}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{flex:1;padding:6px 0;font-size:12px;font-weight:700;color:var(--soft);background:#fff}
.seg button.on{background:var(--green);color:#012a1b}
input[type=color]{width:32px;height:29px;border:1px solid var(--line);border-radius:7px;padding:2px;background:#fff;cursor:pointer;flex:none}
input[type=range]{width:100%;accent-color:var(--green)}
.sws{display:flex;gap:5px;flex-wrap:wrap}
.sw{width:23px;height:23px;border-radius:6px;border:1px solid rgba(0,0,0,.1);cursor:pointer;position:relative}
.sw.bound:after{content:"⛓";position:absolute;inset:0;display:grid;place-items:center;font-size:9px;color:#fff;text-shadow:0 0 3px #000}
.linkchip{display:inline-flex;align-items:center;gap:5px;background:#E7FBF2;color:var(--gink);border-radius:6px;padding:3px 7px;font-size:10.5px;font-weight:800;margin-bottom:6px}
.linkchip button{font-size:11px;color:var(--gink);opacity:.7}
.linkchip.off{background:#F0F2F2;color:var(--faint)}
.shapegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.shp{aspect-ratio:1/1;border:1px solid var(--line);border-radius:8px;background:#fff;display:grid;place-items:center}
.shp:hover{border-color:var(--green)}.shp svg{width:22px;height:22px}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tcell{border-radius:9px;overflow:hidden;border:1px solid var(--line);cursor:pointer;background:#fff}
.tcell:hover{border-color:var(--green)}
.tcell .cap{font-size:10px;font-weight:700;padding:4px 5px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catbtn{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 9px;font-size:11.5px;font-weight:700;margin-bottom:5px}
.catbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.hint{font-size:10.5px;color:var(--faint);line-height:1.5;margin-top:5px}
.empty{font-size:12px;color:var(--faint);line-height:1.5}
.roleRow{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.roleRow .rn{font-size:11.5px;font-weight:700;flex:1}
.roleRow .rh{font-size:10px;color:var(--faint);font-family:monospace}
.logobox{border:1.5px dashed #C8D2CE;border-radius:11px;height:74px;display:grid;place-items:center;margin-bottom:7px;overflow:hidden;background:#FAFBFB}
.logobox img{max-width:80%;max-height:80%;object-fit:contain}
.stagew{flex:1;overflow:auto;position:relative}
.pad{padding:50px;min-width:min-content;min-height:min-content;display:flex;justify-content:center}
#outer{position:relative}
#board{position:relative;transform-origin:top left;box-shadow:0 12px 44px -14px rgba(0,0,0,.3);overflow:hidden}
#grid{position:absolute;inset:0;pointer-events:none;z-index:9998;display:none}#grid.on{display:block}
.el{position:absolute;user-select:none}
.el .txt{width:100%;height:100%;outline:none;overflow:hidden;word-wrap:break-word;white-space:pre-wrap}
.el img,.el svg{width:100%;height:100%;display:block;pointer-events:none}
.handle{position:absolute;background:#fff;border:2px solid var(--green);border-radius:2px}
.rot{position:absolute;background:var(--green);border-radius:50%}
.rotline{position:absolute;background:var(--green)}
.snapline{position:absolute;background:#FF3D8B;pointer-events:none;z-index:9999}
.layers{display:flex;flex-direction:column;gap:4px}
.layer{display:flex;align-items:center;gap:6px;padding:6px 7px;border:1px solid var(--line);border-radius:8px;font-size:12px;cursor:pointer;background:#fff}
.layer.sel{border-color:var(--green);box-shadow:0 0 0 1px var(--green)}
.layer .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.layer .k{font-size:11px;color:var(--faint);width:13px;text-align:center}
.layer .x{font-size:12px;color:var(--faint);padding:0 2px}
.file{display:none}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:9px;font-size:12.5px;font-weight:700;z-index:9999;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="rail">
    <div class="rmark">Z</div>
    <button class="rnew" id="railNew" title="Create new">+</button>
    <div class="rlbl">Create</div>
    <button class="rb on" data-nav="home"><span class="ic">⌂</span>Home</button>
    <button class="rb" data-nav="designs"><span class="ic">▤</span>Designs</button>
    <button class="rb" data-nav="templates"><span class="ic">▦</span>Templates</button>
    <button class="rb" data-nav="brand"><span class="ic">◈</span>Brand</button>
  </div>

  <div class="home" id="home">
    <div class="hwrap">
      <div class="hero">
        <div class="kick">Zelvoo Creative Studio</div>
        <h1>What are we <em>shipping</em> today?</h1>
        <p>Every template below is linked to your Brand Kit. Switch brands and the whole library re-skins.</p>
        <div class="startrow">
          <button class="bigbtn" id="btnNew"><span class="p">+</span>Create new design</button>
          <button class="bigbtn alt" id="btnCustom"><span class="p">⤢</span>Custom size</button>
        </div>
      </div>
      <div class="brandstrip" id="brandstrip"></div>
      <div class="fmts" id="fmts"></div>
      <div class="sechead"><h2>Your designs</h2><span class="c" id="rcount"></span></div>
      <div class="recents" id="recents"></div>
      <div class="sechead"><h2>Templates</h2><span class="c" id="tcount"></span></div>
      <div class="cats" id="cats"></div>
      <div class="gal" id="gal"></div>
    </div>
  </div>

  <div class="editor" id="editor">
    <div class="top">
      <button class="btn" id="backHome">← Home</button>
      <input type="text" id="docName" value="Untitled design" style="width:140px;font-weight:700">
      <div class="sep"></div>
      <select id="preset"></select>
      <input type="number" id="cw" class="mini" value="1080"><span style="color:var(--faint)">×</span><input type="number" id="ch" class="mini" value="1080">
      <button class="btn" id="applySize">Apply</button>
      <div class="sep"></div>
      <button class="btn icon" id="undo">↶</button><button class="btn icon" id="redo">↷</button>
      <div class="spacer"></div>
      <button class="kitchip" id="kitChip"></button>
      <button class="btn icon" id="gridT" title="Grid">▦</button>
      <div class="zoomctl"><button id="zOut">−</button><span id="zLbl">50%</span><button id="zIn">+</button></div>
      <button class="btn" id="fit">Fit</button>
      <div class="sep"></div>
      <button class="btn" id="saveDoc">Save</button>
      <select id="fmt"><option value="png">PNG</option><option value="jpg">JPG</option><option value="webp">WebP</option><option value="svg">SVG</option><option value="pdf">PDF</option></select>
      <select id="scale"><option value="1">1×</option><option value="2" selected>2×</option><option value="3">3×</option></select>
      <button class="btn green" id="exportBtn">Download</button>
    </div>
    <div class="ebody">
      <div class="erail">
        <button class="eb on" data-p="templates"><span class="ic">▦</span>Templates</button>
        <button class="eb" data-p="text"><span class="ic">T</span>Text</button>
        <button class="eb" data-p="shapes"><span class="ic">◆</span>Shapes</button>
        <button class="eb" data-p="uploads"><span class="ic">▣</span>Uploads</button>
        <button class="eb" data-p="bg"><span class="ic">◑</span>Canvas</button>
        <button class="eb" data-p="brand"><span class="ic">◈</span>Brand</button>
        <button class="eb" data-p="layers"><span class="ic">≡</span>Layers</button>
      </div>
      <div class="side" id="side"></div>
      <div class="stagew" id="stage"><div class="pad"><div id="outer"><div id="board"><div id="grid"></div></div></div></div></div>
      <div class="side" id="props" style="width:292px;border-right:none;border-left:1px solid var(--line)"></div>
    </div>
  </div>
</div>
<div class="mask" id="mask"><div class="modal" id="modalBody"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="imgFile" class="file" accept="image/*">
<input type="file" id="logoFile" class="file" accept="image/*">
<input type="file" id="fontFile" class="file" accept=".ttf,.otf,.woff,.woff2">
<input type="file" id="projFile" class="file" accept=".json">

<script>
/* ==================== BASICS ==================== */
const $=id=>document.getElementById(id);
const board=$('board'),outer=$('outer'),stage=$('stage');
const G='#00DF81',DK='#046B45',D='#0A0F0D',W='#FFFFFF',L='#F7F9F9',CR='#F3EFE7';
let AB={w:1080,h:1080,bg:{t:'solid',c:'#FFFFFF',c1:G,c2:DK,ang:135}};
let els=[],selIds=[],zoom=.5,uid=1,nodes={},hist=[],hp=-1,DOCS=[];

function shade(hex,amt){
  if(!/^#[0-9a-f]{6}$/i.test(hex))return hex;
  const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  const f=v=>Math.max(0,Math.min(255,Math.round(amt<0?v*(1+amt):v+(255-v)*amt)));
  return '#'+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function lum(hex){if(!/^#[0-9a-f]{6}$/i.test(hex))return .5;const n=parseInt(hex.slice(1),16);
  return(((n>>16)&255)*.299+((n>>8)&255)*.587+(n&255)*.114)/255;}

/* Maps a row from the real `brands` table (see brand-kit page) onto this tool's 6-role palette + 3-role type system. */
function kitFromBrand(b){
  const cs=(b.colors&&b.colors.length?b.colors:['#00DF81','#046B45']);
  const p0=cs[0]||'#00DF81',p4=cs[1]||shade(p0,.3),p1=cs[2]||shade(p0,-.4);
  const packed=/^display:(.*)\|head:(.*)\|body:(.*)$/.exec(b.fonts||'');
  let fonts;
  if(packed)fonts={display:packed[1],head:packed[2],body:packed[3]};
  else{const parts=(b.fonts||'').split('/').map(s=>s.trim()).filter(Boolean);
    fonts=parts.length>=2?{display:'Archivo Black',head:parts[0],body:parts[1]}
      :parts.length===1?{display:'Archivo Black',head:parts[0],body:parts[0]}
      :{display:'Archivo Black',head:'Inter',body:'Inter'};}
  return {id:b.id,name:b.name||'Untitled brand',
    colors:{p0,p1,p2:'#0A0F0D',p3:'#F7F9F9',p4,mute:'#8D9793'},fonts,
    logo:b.logo_url||null,mark:(b.name||'?').trim().charAt(0).toUpperCase()||'?',
    handle:'@'+(b.name||'brand').toLowerCase().replace(/[^a-z0-9]+/g,''),
    tagline:(b.taglines||'').split('\n')[0]||''};
}
function packFonts(f){return `display:${f.display}|head:${f.head}|body:${f.body}`;}
function roleHex(r){
  const k=K();
  if(r==='on0')return lum(k.colors.p0)>.55?shade(k.colors.p0,-.82):'#FFFFFF';
  return k.colors[r]||k.colors.p2;
}
function roleFont(r){return K().fonts[r]||K().fonts.body;}

/* source palette used when authoring templates -> role map */
const SRC={'#00df81':'p0','#046b45':'p1','#0a0f0d':'p2','#ffffff':'p3','#f7f9f9':'p3','#fbfaf7':'p3','#f3efe7':'p3',
 '#ff6b35':'p4','#f7b500':'p4','#e43d6b':'p4','#012a1b':'on0','#023a25':'on0','#8d9793':'mute','#a9b6af':'mute','#8fa79b':'mute','#5a655f':'mute','#5e7269':'mute'};
const SRCF={'unbounded':'head','hanken grotesk':'body','archivo black':'display','anton':'display'};
function autoBind(list){
  return list.map(e=>{
    const o=clone(e),b={};
    if(o.kind==='text'){
      const r=SRC[(o.color||'').toLowerCase()];if(r)b.color=r;
      const rc=SRC[(o.oc||'').toLowerCase()];if(rc&&o.ow>0)b.oc=rc;
      const f=SRCF[(o.font||'').toLowerCase()];if(f)b.font=f;
    } else if(o.kind==='shape'){
      const r=SRC[(o.fill.c||'').toLowerCase()];if(r)b.fill=r;
      const r1=SRC[(o.fill.c1||'').toLowerCase()];if(r1)b.c1=r1;
      const r2=SRC[(o.fill.c2||'').toLowerCase()];if(r2)b.c2=r2;
      const rs=SRC[(o.stroke||'').toLowerCase()];if(rs&&o.strokeW>0)b.stroke=rs;
    }
    if(Object.keys(b).length)o.bind=b;
    return o;
  });
}
/* resolve bindings -> concrete values */
function R(e){
  if(!e.bind)return e;
  const o={...e},b=e.bind;
  if(b.color)o.color=roleHex(b.color);
  if(b.oc)o.oc=roleHex(b.oc);
  if(b.font)o.font=roleFont(b.font);
  if(b.stroke)o.stroke=roleHex(b.stroke);
  if(b.fill||b.c1||b.c2){o.fill={...e.fill};
    if(b.fill)o.fill.c=roleHex(b.fill);
    if(b.c1)o.fill.c1=roleHex(b.c1);
    if(b.c2)o.fill.c2=roleHex(b.c2);}
  if(b.logo&&K().logo)o.src=K().logo;
  if(b.text==='handle')o.text=K().handle;
  if(b.text==='tagline')o.text=K().tagline;
  return o;
}

function fillCSS(f){
  if(f.t==='linear')return `linear-gradient(${f.ang}deg, ${f.c1}, ${f.c2})`;
  if(f.t==='dots')return `radial-gradient(${f.c2} ${f.sz/2}px, transparent ${f.sz/2}px) 0 0/${f.sz*2.6}px ${f.sz*2.6}px, ${f.c}`;
  if(f.t==='stripes')return `repeating-linear-gradient(${f.ang}deg, ${f.c2} 0 ${f.sz}px, ${f.c} ${f.sz}px ${f.sz*2.4}px)`;
  if(f.t==='grid')return `repeating-linear-gradient(0deg,${f.c2} 0 1.5px,transparent 1.5px ${f.sz}px),repeating-linear-gradient(90deg,${f.c2} 0 1.5px,transparent 1.5px ${f.sz}px), ${f.c}`;
  return f.c;
}

/* ==================== RENDER HELPERS ==================== */
function elCSS(e,sc=1){
  const sh=e.sh&&e.sh.on?`${e.sh.x*sc}px ${e.sh.y*sc}px ${e.sh.blur*sc}px ${e.sh.c}`:'';
  let s=`position:absolute;left:${e.x*sc}px;top:${e.y*sc}px;width:${e.w*sc}px;height:${e.h*sc}px;transform:rotate(${e.rot}deg);opacity:${e.opacity};`;
  if(e.kind==='shape'&&!isSVG(e)){
    s+=`background:${fillCSS(e.fill)};border-radius:${e.shape==='ellipse'?'50%':(e.radius*sc)+'px'};`;
    if(e.strokeW>0)s+=`border:${e.strokeW*sc}px solid ${e.stroke};`;
    if(sh)s+=`box-shadow:${sh};`;}
  if(e.kind==='shape'&&isSVG(e)&&e.sh&&e.sh.on)s+=`filter:drop-shadow(${e.sh.x*sc}px ${e.sh.y*sc}px ${e.sh.blur*sc/2}px ${e.sh.c});`;
  if(e.kind==='image'){s+=`border-radius:${e.radius*sc}px;overflow:hidden;`;if(sh)s+=`box-shadow:${sh};`;}
  return s;
}
function txtCSS(e,sc=1){
  const sh=e.sh&&e.sh.on?`${e.sh.x*sc}px ${e.sh.y*sc}px ${e.sh.blur*sc}px ${e.sh.c}`:'';
  const shadows=[strokeShadow(e.ow*sc,e.oc),sh].filter(Boolean).join(',');
  return `width:100%;height:100%;outline:none;overflow:hidden;word-wrap:break-word;white-space:pre-wrap;font-family:'${e.font}';font-size:${e.size*sc}px;font-weight:${e.weight};font-style:${e.italic?'italic':'normal'};text-decoration:${e.under?'underline':'none'};text-align:${e.align};color:${e.color};line-height:${e.lh};letter-spacing:${e.ls*sc}px;text-shadow:${shadows}`;
}
function shapeSVG(e){
  const gid='g'+Math.random().toString(36).slice(2,8),lin=e.fill.t==='linear';
  const paint=lin?`url(#${gid})`:(e.fill.c==='transparent'?'none':e.fill.c);
  const defs=lin?`<defs><linearGradient id="${gid}" gradientTransform="rotate(${e.fill.ang-90} .5 .5)"><stop offset="0" stop-color="${e.fill.c1}"/><stop offset="1" stop-color="${e.fill.c2}"/></linearGradient></defs>`:'';
  const st=e.strokeW>0?` stroke="${e.stroke}" stroke-width="${(e.strokeW/Math.max(e.w,e.h))*100}"`:'';
  return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">${defs}<polygon points="${PATHS[e.shape]}" fill="${paint}"${st}/></svg>`;
}
function previewHTML(list,tw,th,boxW){
  const sc=boxW/tw;let inner='';
  list.forEach((raw,i)=>{
    const e=R(raw),z=`z-index:${i+1};`;
    if(e.kind==='text')inner+=`<div style="${elCSS(e,sc)}${z}"><div style="${txtCSS(e,sc)}">${tcase(e.text,e.tcase).replace(/</g,'&lt;')}</div></div>`;
    else if(e.kind==='image')inner+=`<div style="${elCSS(e,sc)}${z}"><img src="${e.src}" style="width:100%;height:100%;object-fit:${e.fit}"></div>`;
    else if(isSVG(e))inner+=`<div style="${elCSS(e,sc)}${z}">${shapeSVG(e)}</div>`;
    else inner+=`<div style="${elCSS(e,sc)}${z}"></div>`;});
  return `<div style="position:relative;width:${boxW}px;height:${th*sc}px;overflow:hidden;background:#fff">${inner}</div>`;
}

    [['nw',0,0],['n',.5,0],['ne',1,0],['e',1,.5],['se',1,1],['s',.5,1],['sw',0,1],['w',0,.5]].forEach(([k,fx,fy])=>{

    r.addEventListener('pointerdown',ev=>rotate(ev,e.id));w.appendChild(r);hw.appendChild(w);
  } else {
    const x1=Math.min(...S.map(e=>e.x)),y1=Math.min(...S.map(e=>e.y)),x2=Math.max(...S.map(e=>e.x+e.w)),y2=Math.max(...S.map(e=>e.y+e.h));

    b.style.cssText=`position:absolute;left:${x1}px;top:${y1}px;width:${x2-x1}px;height:${y2-y1}px;outline:${2/zoom}px dashed var(--green)`;hw.appendChild(b);}

let guides=[];
function clearG(){guides.forEach(g=>g.remove());guides=[];}
function showG(v,pos){const d=document.createElement('div');d.className='snapline';
  d.style.cssText=v?`left:${pos}px;top:0;width:${1/zoom}px;height:${AB.h}px`:`top:${pos}px;left:0;height:${1/zoom}px;width:${AB.w}px`;board.appendChild(d);guides.push(d);}
function snapPos(e,nx,ny){
  const T=7/zoom;let sx=nx,sy=ny;clearG();
  const others=els.filter(o=>!selIds.includes(o.id)&&!o.hide);
  const vt=[0,AB.w/2,AB.w],ht=[0,AB.h/2,AB.h];
  others.forEach(o=>{vt.push(o.x,o.x+o.w/2,o.x+o.w);ht.push(o.y,o.y+o.h/2,o.y+o.h);});
  let bd=T,bt=null,bi=0;
  [nx,nx+e.w/2,nx+e.w].forEach((m,i)=>vt.forEach(t=>{if(Math.abs(m-t)<bd){bd=Math.abs(m-t);bt=t;bi=i;}}));
  if(bt!==null){sx=bt-[0,e.w/2,e.w][bi];showG(1,bt);}
  bd=T;bt=null;
  [ny,ny+e.h/2,ny+e.h].forEach((m,i)=>ht.forEach(t=>{if(Math.abs(m-t)<bd){bd=Math.abs(m-t);bt=t;bi=i;}}));

function down(ev,id){

  const S=selIds.map(i=>els.find(x=>x.id===i)).filter(Boolean);
  const sx=ev.clientX,sy=ev.clientY,st=S.map(x=>({e:x,ox:x.x,oy:x.y}));let moved=false;
  const mv=m=>{moved=true;let dx=(m.clientX-sx)/zoom,dy=(m.clientY-sy)/zoom;
    if(S.length===1&&!m.altKey){const[nx,ny]=snapPos(e,st[0].ox+dx,st[0].oy+dy);dx=nx-st[0].ox;dy=ny-st[0].oy;}
    st.forEach(s=>{s.e.x=s.ox+dx;s.e.y=s.oy+dy;style(s.e);});syncH();};
  const up=()=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);clearG();if(moved){snap();panel();}};
  document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);

function resize(ev,id,k){

    const dx=rx*Math.cos(a)-ry*Math.sin(a),dy=rx*Math.sin(a)+ry*Math.cos(a);
    let w=ow,h=oh;
    if(k.includes('e'))w=Math.max(12,ow+dx);
    if(k.includes('w'))w=Math.max(12,ow-dx);
    if(k.includes('s'))h=Math.max(8,oh+dy);
    if(k.includes('n'))h=Math.max(8,oh-dy);
    if(m.shiftKey&&k.length===2){if(w/ar>h)h=w/ar;else w=h*ar;}
    if(e.kind==='text'&&k.length===2&&m.altKey)e.size=Math.max(6,os*(w/ow));

  document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);
}
function rotate(ev,id){

  const up=()=>{document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);snap();panel();};
  document.addEventListener('pointermove',mv);document.addEventListener('pointerup',up);

document.addEventListener('keydown',ev=>{

function dist(v){

function layers(){
  const box=$('lrs');if(!box)return;
  if(!els.length){box.innerHTML='<div class="empty">Nothing on the artboard yet.</div>';return;}
  box.innerHTML=[...els].reverse().map(e=>{
    const n=e.kind==='text'?(e.text.slice(0,16)||'Text'):e.kind==='image'?'Image':e.shape.charAt(0).toUpperCase()+e.shape.slice(1);
    const lk=e.bind&&Object.keys(e.bind).length?'<span style="color:var(--gink);font-size:10px">🔗</span>':'';
    return `<div class="layer ${selIds.includes(e.id)?'sel':''}" data-id="${e.id}"><span class="k">${e.kind==='text'?'T':e.kind==='image'?'▣':'◆'}</span><span class="t">${n}</span>${lk}
      <button class="x" data-h="${e.id}">${e.hide?'👁':'👁'}</button><button class="x" data-l="${e.id}">${e.lock?'🔒':'🔓'}</button></div>`;}).join('');
  box.querySelectorAll('.layer').forEach(l=>l.onclick=ev=>{if(ev.target.dataset.h||ev.target.dataset.l)return;
    const id=+l.dataset.id;sel(ev.shiftKey?(selIds.includes(id)?selIds.filter(i=>i!==id):[...selIds,id]):[id]);});
  box.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{const e=els.find(x=>x.id==b.dataset.h);e.hide=!e.hide;selIds=selIds.filter(i=>i!=e.id);render();snap();});
  box.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{const e=els.find(x=>x.id==b.dataset.l);e.lock=!e.lock;selIds=selIds.filter(i=>i!=e.id);render();snap();});
}

function brandSws(attr){return `<div class="sws" style="margin-bottom:7px">${ROLES.map(([r,n])=>`<div class="sw" style="background:${roleHex(r)}" data-${attr}="${r}" title="Link to ${n}"></div>`).join('')}</div>`;}

function bakeFX(e){
  const f=e.fx;
  if(f.br===100&&f.co===100&&f.sa===100&&f.bl===0&&f.gs===0){e.src=e.osrc;style(e);snap();return;}
  const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=im.width;c.height=im.height;
    const x=c.getContext('2d');x.filter=`brightness(${f.br}%) contrast(${f.co}%) saturate(${f.sa}%) grayscale(${f.gs}%) blur(${f.bl}px)`;
    x.drawImage(im,0,0);e.src=c.toDataURL('image/png');style(e);snap();};im.src=e.osrc;
}

}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function wrapText(e){
  const c=document.createElement('canvas').getContext('2d');
  c.font=`${e.italic?'italic ':''}${e.weight} ${e.size}px "${e.font}"`;
  const out=[];
  tcase(e.text,e.tcase).split('\n').forEach(p=>{let line='';
    p.split(' ').forEach(w=>{const t=line?line+' '+w:w;if(c.measureText(t).width>e.w&&line){out.push(line);line=w;}else line=t;});out.push(line);});
  return out;
}
function toSVG(){
  let defs='',body='';let bgf=AB.bg.c;
  if(AB.bg.t==='linear'){defs+=`<linearGradient id="abg" gradientTransform="rotate(${AB.bg.ang-90} .5 .5)"><stop offset="0" stop-color="${AB.bg.c1}"/><stop offset="1" stop-color="${AB.bg.c2}"/></linearGradient>`;bgf='url(#abg)';}
  body+=`<rect width="${AB.w}" height="${AB.h}" fill="${bgf}"/>`;
  els.forEach(raw=>{
    const e=R(raw);if(e.hide)return;
    const tr=e.rot?` transform="rotate(${e.rot} ${e.x+e.w/2} ${e.y+e.h/2})"`:'';
    const op=e.opacity<1?` opacity="${e.opacity}"`:'';
    if(e.kind==='shape'){
      let paint=e.fill.c==='transparent'?'none':e.fill.c;
      if(e.fill.t==='linear'){const id='g'+e.id;defs+=`<linearGradient id="${id}" gradientTransform="rotate(${e.fill.ang-90} .5 .5)"><stop offset="0" stop-color="${e.fill.c1}"/><stop offset="1" stop-color="${e.fill.c2}"/></linearGradient>`;paint=`url(#${id})`;}
      const st=e.strokeW>0?` stroke="${e.stroke}" stroke-width="${e.strokeW}"`:'';
      if(e.shape==='ellipse')body+=`<ellipse cx="${e.x+e.w/2}" cy="${e.y+e.h/2}" rx="${e.w/2}" ry="${e.h/2}" fill="${paint}"${st}${tr}${op}/>`;
      else if(PATHS[e.shape]){const pts=PATHS[e.shape].split(' ').map(p=>{const[a,c]=p.split(',').map(Number);return `${e.x+a/100*e.w},${e.y+c/100*e.h}`;}).join(' ');
        body+=`<polygon points="${pts}" fill="${paint}"${st}${tr}${op}/>`;}
      else body+=`<rect x="${e.x}" y="${e.y}" width="${e.w}" height="${e.h}" rx="${e.radius}" fill="${paint}"${st}${tr}${op}/>`;
    } else if(e.kind==='image'){
      body+=`<image x="${e.x}" y="${e.y}" width="${e.w}" height="${e.h}" href="${e.src}" preserveAspectRatio="${e.fit==='cover'?'xMidYMid slice':e.fit==='contain'?'xMidYMid meet':'none'}"${tr}${op}/>`;
    } else {
      const lines=wrapText(e),lh=e.size*e.lh;
      const anch=e.align==='center'?'middle':e.align==='right'?'end':'start';
      const ax=e.align==='center'?e.x+e.w/2:e.align==='right'?e.x+e.w:e.x;
      const so=e.ow>0?` stroke="${e.oc}" stroke-width="${e.ow*2}" paint-order="stroke"`:'';
      body+=`<text x="${ax}" y="${e.y+e.size*.82}" font-family="${esc(e.font)}" font-size="${e.size}" font-weight="${e.weight}" ${e.italic?'font-style="italic" ':''}letter-spacing="${e.ls}" fill="${e.color==='transparent'?'none':e.color}" text-anchor="${anch}"${so}${tr}${op}>`
        +lines.map((l,i)=>`<tspan x="${ax}" dy="${i?lh:0}">${esc(l)}</tspan>`).join('')+`</text>`;
    }});
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${AB.w}" height="${AB.h}" viewBox="0 0 ${AB.w} ${AB.h}"><defs>${defs}</defs>${body}</svg>`;
}
function dl(href,name){const a=document.createElement('a');a.href=href;a.download=name;a.click();}
$('exportBtn').onclick=async()=>{
  const fmt=$('fmt').value,sc=+$('scale').value;
  const base=($('docName').value||'zelvoo').replace(/\s+/g,'-').toLowerCase()+`-${K().name.toLowerCase()}-${AB.w}x${AB.h}`;
  const b=$('exportBtn');b.textContent='Working…';b.disabled=true;

    else if(fmt==='pdf'){

      const {jsPDF}=window.jspdf;

      dl(c.toDataURL(mime,.94),`${base}@${sc}x.${fmt}`);toast(fmt.toUpperCase()+' exported at '+(AB.w*sc)+'×'+(AB.h*sc));}

/* ==================== WORKSPACE SYNC ====================
   Embedded via <iframe src="/creative-studio.html"> inside /image-studio.
   The parent page owns the authenticated Supabase session; this file never
   talks to Supabase directly. It just exchanges postMessages with the parent
   for the user's real Brand Kits + saved designs. Falls back to demo kits /
   session-only designs if no parent replies (e.g. opened standalone). */
function post(msg){
  try{if(window.parent&&window.parent!==window)window.parent.postMessage(Object.assign({ns:'zelvoo'},msg),window.location.origin);}catch(e){}
}

  clearTimeout(brandSyncTimer);
  brandSyncTimer=setTimeout(()=>{
    const k=K(),reqId='b'+Math.random().toString(36).slice(2);
    k._req=reqId;
    post({type:'saveBrand',reqId,brand:{id:k.id||null,name:k.name,colors:[k.colors.p0,k.colors.p4,k.colors.p1],
      fonts:packFonts(k.fonts),logo_url:k.logo,taglines:k.tagline}});
  },700);
}
function applyInit(payload){
  KITS=(payload.kits&&payload.kits.length)?payload.kits.map(kitFromBrand):DEMO_KITS.map(clone);
  kitIx=0;
  if(payload.designs&&payload.designs.length){
    DOCS=payload.designs.map(d=>({id:d.id,name:d.name,brandId:d.brand_id||null,AB:d.data.AB,els:d.data.els}));
  }
  boot();
}
window.addEventListener('message',ev=>{
  if(ev.origin!==window.location.origin)return;
  const d=ev.data;if(!d||d.ns!=='zelvoo')return;
  if(d.type==='init')applyInit(d);
  else if(d.type==='designSaved'){
    const rec=DOCS.find(x=>x._req===d.reqId);
    if(rec){rec.id=d.id;delete rec._req;renderRecents();}
    $('saveDoc').disabled=false;
    toast('Saved — 4 credits used'+(typeof d.balance==='number'?' · '+d.balance+' left':''));
  }
  else if(d.type==='designSaveFailed'){
    const ix=DOCS.findIndex(x=>x._req===d.reqId);
    if(ix>=0){const rec=DOCS[ix];delete rec._req;if(!rec.id)DOCS.splice(ix,1);renderRecents();}
    $('saveDoc').disabled=false;
    toast(d.reason==='insufficient_credits'?'Out of credits — upgrade your plan to keep saving designs':'Could not save — try again');
  }
  else if(d.type==='brandSaved'){const kit=KITS.find(x=>x._req===d.reqId);if(kit){kit.id=d.id;delete kit._req;}}
});

/* ==================== BOOT ==================== */
let booted=false;
function boot(){
  if(booted)return;booted=true;
  document.documentElement.style.setProperty('--green',K().colors.p0);
  document.documentElement.style.setProperty('--gink',K().colors.p1);
  applyBoard();renderHome();kitChip();side();panel();
}
post({type:'ready'});
setTimeout(boot,1200); /* opened standalone / parent never responded — boot with demo kits so the tool still works */
</script>
</body>
